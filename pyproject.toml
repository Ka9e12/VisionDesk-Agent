[project]
name = "visiondesk-agent"
version = "0.1.0"
description = "A local multimodal desktop agent that observes your screen, plans with a vision model, and controls keyboard/mouse from natural-language tasks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "VisionDesk Agent" }]
dependencies = []

[project.optional-dependencies]
control = [
  "pyautogui>=0.9.54",
  "mss>=9.0.1",
  "pillow>=10.0.0"
]
ocr = [
  "pytesseract>=0.3.10"
]
browser = [
  "playwright>=1.44.0"
]
macos = [
  "pyobjc-framework-ApplicationServices>=10.0"
]
dev = [
  "pytest>=8.0.0"
]
all = [
  "pyautogui>=0.9.54",
  "mss>=9.0.1",
  "pillow>=10.0.0",
  "pytesseract>=0.3.10",
  "playwright>=1.44.0",
  "pyobjc-framework-ApplicationServices>=10.0",
  "pytest>=8.0.0"
]

[project.scripts]
desktop-agent = "desktop_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
